<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV Hub · Create account</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">TV<span>HUB</span></a>
        <div>
          <p class="eyebrow">LIVE TELEVISION</p>
          <h1>Live TV from<br />around the world.</h1>
          <p>Create an account to explore channels, save your favorites, and watch live streams.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">GET STARTED</p>
          <h2 id="auth-title">Create your account</h2>
          <p class="auth-copy">Your TV Hub library is ready for you.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
            <button class="auth-submit">Create Account</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
