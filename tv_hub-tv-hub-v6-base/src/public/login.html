<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TV Hub · Sign in</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-layout">
      <section class="auth-intro">
        <a class="brand" href="/">TV<span>HUB</span></a>
        <div>
          <p class="eyebrow">LIVE TELEVISION</p>
          <h1>Your live channels,<br />in one place.</h1>
          <p>Sign in to browse channels by country, save favorites, and start watching.</p>
        </div>
      </section>
      <section class="auth-panel" aria-labelledby="auth-title">
        <div class="auth-card">
          <p class="eyebrow">WELCOME BACK</p>
          <h2 id="auth-title">Sign in to TV Hub</h2>
          <p class="auth-copy">Continue to your live TV library.</p>
          <form id="auth-form">
            <label>Email<input name="email" type="email" autocomplete="email" required /></label>
            <label>Password<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
            <button class="auth-submit">Sign In</button>
            <p id="error" class="error" aria-live="polite"></p>
          </form>
          <p class="auth-switch">New to TV Hub? <a href="/register">Create an account</a></p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
